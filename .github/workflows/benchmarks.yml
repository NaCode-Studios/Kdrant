name: Benchmarks

# Run on demand rather than per commit: JMH takes minutes and a shared runner is too noisy for a
# number worth publishing. Run it on a quiet runner, then record the result in benchmarks/README.md.
on:
  workflow_dispatch:
    inputs:
      qdrant:
        description: Qdrant image to benchmark against
        default: "qdrant/qdrant:v1.18.2"
        type: string

permissions:
  contents: read

jobs:
  jmh:
    name: JMH latency
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: ${{ inputs.qdrant }}
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:6333/readyz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Run the JMH harness
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: ./gradlew :benchmarks:jmh --no-daemon --no-configuration-cache

      - name: Upload the results
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: |
            benchmarks/build/results/jmh/
            benchmarks/build/reports/jmh/
          retention-days: 30
