name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release
  # Build provenance: id-token signs the attestation, attestations stores it against the repository.
  id-token: write
  attestations: write

jobs:
  # The CLI is a binary per platform rather than a jar, so it is built where it runs and attached to
  # the GitHub Release instead of published to Maven Central. Two runners, because a Kotlin/Native
  # binary is linked by the host toolchain: macOS cannot produce the Linux one and Linux cannot
  # produce the macOS one.
  cli:
    name: kdrant-cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
            asset: kdrant-linux-x64
            mcpAsset: kdrant-mcp-linux-x64
          - os: macos-latest
            target: macosArm64
            asset: kdrant-macos-arm64
            mcpAsset: kdrant-mcp-macos-arm64
          # Windows was a target that compiled and shipped nowhere for two releases. The binary is the
          # same one every other platform gets, and it is proven the same way: against a real Qdrant,
          # which upstream publishes for Windows as an msvc zip.
          - os: windows-latest
            target: mingwX64
            asset: kdrant-windows-x64.exe
            mcpAsset: kdrant-mcp-windows-x64.exe
    runs-on: ${{ matrix.os }}
    # Bash everywhere, including the Windows runner, where Git Bash is installed: three copies of each
    # step in two shells is how the platforms drift apart.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The binary links against libcurl, which is what gives it TLS. Saying so here is the same
      # statement the module's documentation makes to somebody downloading it.
      - name: Install libcurl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the binaries
        run: >
          ./gradlew :kdrant-cli:linkKdrantReleaseExecutable${{ matrix.target }}
          :kdrant-mcp:linkKdrant-mcpReleaseExecutable${{ matrix.target }}
          --no-daemon --no-configuration-cache --stacktrace

      # Qdrant, however this runner can start one. A macOS runner has no Docker, which is the same
      # constraint ci.yml's native-contract-macos job already works around: the released binary is the
      # same server, and Testcontainers is a JVM convenience this job has no JVM for.
      - name: Start Qdrant
        env:
          QDRANT_VERSION: "1.19.1"
        run: |
          RELEASES="https://github.com/qdrant/qdrant/releases/download/v${QDRANT_VERSION}"
          case "$RUNNER_OS" in
            Linux)
              docker run -d --name qdrant -p 6333:6333 "qdrant/qdrant:v$QDRANT_VERSION"
              ;;
            macOS)
              curl -fsSL -o qdrant.tar.gz "$RELEASES/qdrant-aarch64-apple-darwin.tar.gz"
              tar -xzf qdrant.tar.gz
              ./qdrant &
              ;;
            Windows)
              curl -fsSL -o qdrant.zip "$RELEASES/qdrant-x86_64-pc-windows-msvc.zip"
              unzip -q qdrant.zip
              ./qdrant.exe &
              ;;
          esac
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:6333/readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::Qdrant did not become ready"; exit 1

      # A binary that has never been run is a binary nobody knows works. It runs a real migration and a
      # real snapshot round trip against that Qdrant before it is allowed near a release.
      - name: Prove it against a real Qdrant
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/prove-cli.sh "$TARGET"

      - name: Speak MCP to the server
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/prove-mcp.sh "$TARGET"

      - name: Name the binaries after the platform they run on
        env:
          ASSET: ${{ matrix.asset }}
          MCP_ASSET: ${{ matrix.mcpAsset }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p cli-artifacts
          # Kotlin/Native writes .exe on mingw and .kexe everywhere else.
          copy_binary() {
            local module="$1" executable="$2" asset="$3"
            local built="$module/build/bin/$TARGET/${executable}ReleaseExecutable/$executable.kexe"
            [ -f "$built" ] || built="$module/build/bin/$TARGET/${executable}ReleaseExecutable/$executable.exe"
            cp "$built" "cli-artifacts/$asset"
            chmod +x "cli-artifacts/$asset"
            # Windows runners have sha256sum through Git Bash and no shasum.
            if command -v shasum >/dev/null 2>&1; then
              ( cd cli-artifacts && shasum -a 256 "$asset" > "$asset.sha256" )
            else
              ( cd cli-artifacts && sha256sum "$asset" > "$asset.sha256" )
            fi
          }
          copy_binary kdrant-cli kdrant "$ASSET"
          copy_binary kdrant-mcp kdrant-mcp "$MCP_ASSET"

      # The binaries get provenance like every jar does. They are a different kind of artifact, not a
      # less trustworthy one, and a downloaded executable is the artifact where provenance matters most.
      - name: Attest build provenance (SLSA)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            cli-artifacts/${{ matrix.asset }}
            cli-artifacts/${{ matrix.mcpAsset }}

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.asset }}
          path: cli-artifacts/
          retention-days: 7

  publish:
    # macOS, because kdrant-core is multiplatform and only a macOS host can compile the Apple targets.
    # A Linux runner would silently skip them and publish a release missing its iOS and macOS klibs.
    runs-on: macos-latest
    # The Release is created here, so the binaries have to exist before it: a job that attached them
    # afterwards would leave a window where the release page shows a CLI that cannot be downloaded.
    needs: cli
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build the jars first so the provenance is attested for the exact artifacts the publish steps
      # upload: those tasks find them up to date and republish these files rather than rebuilding.
      - name: Assemble the published artifacts
        run: ./gradlew assemble --no-daemon --no-configuration-cache

      # Derived from the build rather than listed by hand. A hardcoded list stops covering a module the
      # day one is added and nothing goes red — which is what happened when the gRPC engine arrived. The
      # match is anchored on the block, not the word: kdrant-testkit's build file explains in a comment
      # that it carries no mavenPublishing block, and an unanchored grep attests it for saying so.
      # compgen finds no jar for the BOM, which is how a module with nothing to attest drops out.
      - name: Collect the published artifacts
        id: artifacts
        shell: bash
        run: |
          {
            echo 'paths<<PATHS'
            for m in $(grep -lE '^mavenPublishing \{' */build.gradle.kts | xargs -n1 dirname); do
              compgen -G "$m/build/libs/*.jar" >/dev/null && echo "$m/build/libs/*.jar"
            done
            echo PATHS
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      # `automaticRelease = true` on every module, so the deployment releases itself once the Portal
      # finishes validating it. It used to stop at staged, waiting for somebody to open the Portal and
      # press Publish, and twice nobody did: 2.0.0 and 2.2.0 were both green everywhere, tagged,
      # attested, with binaries attached, and unresolvable. The failure is quiet by construction because
      # every check passes.
      #
      # The argument for the manual step was that it is the last chance to catch something before an
      # artifact becomes permanent, and Maven Central has no unpublish. In practice nobody inspected the
      # staged deployment: they pressed the button because the workflow was green, which is a check that
      # had already run. The step below is what actually stood in for it, and it runs either way.
      - name: Publish to Maven Central
        if: github.event_name == 'push'
        run: ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # The body is extracted from CHANGELOG.md, never written by hand: a release note composed
      # separately is a second copy of what the changelog owns, and the two eventually disagree.
      # Relative links resolve against the tag, so [STABILITY.md](STABILITY.md) points at the released
      # revision rather than at whatever main says later.
      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/     { exit }
            found                 { print }
          ' CHANGELOG.md > notes.md
          # An empty body means the tag and the changelog disagree. Fail rather than publish a blank one.
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Fetch the CLI binaries
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli-artifacts

      # Attached to the Release rather than published to Maven Central: a CLI that needs a package
      # manager and a runtime installed first has given up its only advantage over calling the API.
      # The checksums go with them, because a downloaded binary somebody cannot verify is one they
      # should not run.
      - name: Attach the CLI binaries to the Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la cli-artifacts
          gh release upload "$GITHUB_REF_NAME" cli-artifacts/* --clobber

      # Linked artifacts: tell GitHub which jars this build produced and where they now live. This is
      # metadata, not a second distribution channel — nobody resolves a dependency from here. It is
      # keyed on the same digest as the attestation above, so the repository can say what it built,
      # where it went, and that the two are provably the same file.
      #
      # It runs last and cannot fail the job. On the v2.0.0 tag it returned 404 "no artifacts found"
      # for a digest that does have an attestation, and it took down a release whose jars were already
      # published and attested. A metadata step that can undo a successful publish is worth less than
      # the metadata. `continue-on-error` and a per-artifact `|| true` are the fix; the run's log still
      # says which records were not written.
      #
      # GH_TOKEN falls back to GITHUB_TOKEN. Whether that token may write to this org-level endpoint is
      # undocumented — the docs state only `artifact-metadata:read` for reads — so a PAT with
      # `artifact-metadata` goes in ARTIFACT_METADATA_TOKEN if the 404 turns out to be permission.
      #
      # Only the main jars: sources and javadoc would triple the records for no added claim, and the
      # API documents no DELETE, so a record is permanent. The BOM has no jar and is skipped.
      - name: Record the published artifacts (linked artifacts)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_METADATA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A multiplatform module publishes its JVM jar under a -jvm coordinate, and the bare one
          # carries only Gradle metadata. The record names the artifact that exists; the digest has to
          # match a file, not a coordinate. kdrant-transport-rest and kdrant-migrate joined that list
          # in 2.1.0.
          for artifact in kdrant-core-jvm kdrant-transport-rest-jvm kdrant-transport-grpc \
                          kdrant-spring-boot-starter kdrant-spring-ai kdrant-langchain4j \
                          kdrant-micrometer kdrant-otel kdrant-koog kdrant-migrate-jvm; do
            module="${artifact%-jvm}"
            jar="$module/build/libs/$artifact-$VERSION.jar"
            [ -f "$jar" ] || { echo "::warning::$jar not found, not recorded"; continue; }
            digest="sha256:$(shasum -a 256 "$jar" | cut -d' ' -f1)"
            # The API has no DELETE, so a duplicate cannot be cleaned up: check before writing.
            if gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/artifacts/$digest/metadata/storage-records" \
                 --silent 2>/dev/null; then
              echo "already recorded: $artifact $VERSION"
              continue
            fi
            echo "recording $artifact $VERSION $digest"
            gh api -X POST "/orgs/${GITHUB_REPOSITORY_OWNER}/artifacts/metadata/storage-record" \
              -f name="$artifact" \
              -f version="$VERSION" \
              -f digest="$digest" \
              -f registry_url="https://repo1.maven.org/maven2/" \
              -f artifact_url="https://repo1.maven.org/maven2/io/github/nacode-studios/$artifact/$VERSION/$artifact-$VERSION.jar" \
              --silent || echo "::warning::could not record $artifact $VERSION"
          done

      # "Published" was an assumption for three releases running, and this turns it into an observation:
      # it asks repo1 for the POM of every artifact the release claims.
      #
      # It runs last, and the first time it ran it was second-to-last, which cost 2.3.0 its GitHub Release
      # and its binaries. Central had published everything and its CDN had not finished serving three of
      # the eleven, so the check failed correctly and took the steps after it down with it. A release that
      # happened then had no record of having happened, which is worse than the problem being checked for.
      # A check reports; it does not decide whether to write down what already occurred.
      #
      # It also polls the modules together rather than one after another. Per-module waiting made the
      # worst case the sum of eleven timeouts; this way the budget is one wait for the slowest.
      - name: Check the release resolves from Maven Central
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://repo1.maven.org/maven2/io/github/nacode-studios"
          pending="kdrant-bom kdrant-core kdrant-transport-rest kdrant-transport-grpc kdrant-migrate
                   kdrant-spring-boot-starter kdrant-spring-ai kdrant-langchain4j kdrant-micrometer
                   kdrant-otel kdrant-koog"
          # 60 rounds of 30 seconds: half an hour for the slowest, not half an hour each.
          for _ in $(seq 1 60); do
            still=""
            for module in $pending; do
              curl -fsSL -o /dev/null "$BASE/$module/$VERSION/$module-$VERSION.pom" || still="$still $module"
            done
            pending="$still"
            [ -z "$pending" ] && break
            sleep 30
          done
          {
            echo "## Maven Central"
            echo
            if [ -n "$pending" ]; then
              echo "Not resolving after thirty minutes:$pending"
              echo
              echo "The deployment may still be propagating. The release itself is recorded either way."
            else
              echo "Every artifact resolves at \`$VERSION\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pending" ]; then
            echo "::error::these artifacts do not resolve from Maven Central at $VERSION:$pending"
            exit 1
          fi
