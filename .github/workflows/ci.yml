name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Run every JavaScript-based action on Node 24. The runner is phasing out Node 20
# (some actions still declare node20); this forces the newer runtime everywhere and
# drops the "Node 20 is being deprecated" warnings.
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.2.0

  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7

      # `build` links the linuxX64 test binary, and the Linux engine is Ktor's Curl. Without the
      # headers the link fails, which is a confusing way to learn that the transport went native.
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build, test, lint (ktlint + detekt) and verify public API
        run: ./gradlew build --no-daemon --stacktrace

      - name: Coverage (Kover)
        if: matrix.java == '17'
        run: ./gradlew koverXmlReport koverHtmlReport koverVerify --no-daemon --stacktrace

      - name: Upload coverage report
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/reports/kover/
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-jdk-${{ matrix.java }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # The Linux build above compiles the multiplatform modules for the JVM, Linux and Windows, and skips
  # the Apple targets because no Linux host can build them. Without this job an iOS or macOS break would
  # first be seen at release time, on the one runner that does compile them.
  apple-targets:
    name: Apple targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # The transport is here as well as the core from 2.1.0. Before that an iOS consumer got the
      # models and no engine, so compiling the core alone was the whole claim.
      - name: Compile and test the Apple targets
        run: >
          ./gradlew
          :kdrant-core:compileKotlinIosArm64
          :kdrant-core:compileKotlinIosX64
          :kdrant-core:iosSimulatorArm64Test
          :kdrant-core:macosArm64Test
          :kdrant-transport-rest:compileKotlinIosArm64
          :kdrant-transport-rest:compileKotlinIosX64
          :kdrant-transport-rest:compileKotlinIosSimulatorArm64
          :kdrant-migrate:compileKotlinIosArm64
          --no-daemon --stacktrace

  # M38's exit criterion. A klib that links has not been shown to work, so the same behavioural contract
  # the JVM runs is run from a native binary against a real Qdrant — once on Linux, once on macOS.
  native-contract-linux:
    name: Client contract (Linux native)
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7

      # The Linux engine is Curl, which links against the system libcurl. Saying so here is the same
      # statement the module's KDoc makes to a consumer building for a slim image.
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run the client contract from a linuxX64 binary
        env:
          KDRANT_QDRANT_HOST: 127.0.0.1
          KDRANT_QDRANT_PORT: "6333"
          KDRANT_QDRANT_REQUIRED: "1"
        run: ./gradlew :kdrant-transport-rest:linuxX64Test --no-daemon --stacktrace

  native-contract-macos:
    name: Client contract (macOS native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # No Docker on a macOS runner, so Qdrant is the released binary rather than the image. It is the
      # same server; Testcontainers is a JVM convenience, and this job has no JVM in the process under
      # test.
      - name: Start Qdrant
        run: |
          curl -fsSL -o qdrant.tar.gz \
            "https://github.com/qdrant/qdrant/releases/download/v${QDRANT_VERSION}/qdrant-aarch64-apple-darwin.tar.gz"
          tar -xzf qdrant.tar.gz
          ./qdrant &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:6333/readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::Qdrant did not become ready"; exit 1
        env:
          QDRANT_VERSION: "1.18.2"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run the client contract from a macosArm64 binary
        env:
          KDRANT_QDRANT_HOST: 127.0.0.1
          KDRANT_QDRANT_PORT: "6333"
          KDRANT_QDRANT_REQUIRED: "1"
        run: ./gradlew :kdrant-transport-rest:macosArm64Test --no-daemon --stacktrace

  # M40's exit criterion. The README's comparison table claimed Kdrant was GraalVM native-image friendly
  # and needed no reflection configuration, and nobody had ever built an image. This job is the claim:
  # --no-fallback fails the build the day a dependency starts reflecting, and the binary then has to
  # answer a real search against a real Qdrant.
  native-image:
    name: GraalVM native image
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7

      # Two JDKs on purpose: the library modules compile against a 17 toolchain, and native-image comes
      # from the GraalVM distribution, which is a 21.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build the native image
        run: >
          ./gradlew :example-native-image:nativeCompile
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,GRAALVM_HOME
          --no-daemon --stacktrace

      - name: Search from the native image, and measure what it cost
        env:
          QDRANT_HOST: 127.0.0.1
          QDRANT_PORT: "6333"
        run: |
          BINARY=example-native-image/build/native/nativeCompile/kdrant-native-smoke
          SIZE_MB=$(du -m "$BINARY" | cut -f1)
          OUTPUT=$("$BINARY")
          echo "$OUTPUT"
          FIRST_SEARCH_MS=$(printf '%s\n' "$OUTPUT" | sed -n 's/^KDRANT_TIME_TO_FIRST_SEARCH_MS=//p')
          if [ -z "$FIRST_SEARCH_MS" ]; then
            echo "::error::the native image did not report a time to first search"; exit 1
          fi
          {
            echo "### GraalVM native image"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Binary size | ${SIZE_MB} MB |"
            echo "| Time to first search, cold | ${FIRST_SEARCH_MS} ms |"
            echo "| Reflection metadata | generated from the classpath, shipped in kdrant-transport-rest |"
          } >> "$GITHUB_STEP_SUMMARY"

  qdrant-compat:
    name: Integration (${{ matrix.qdrant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qdrant:
          - "qdrant/qdrant:v1.18.2"
          - "qdrant/qdrant:latest"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # Both engines run the same client contract from kdrant-testkit, against the same image. The otel
      # and migrate modules join them: neither can be proven against a mock — one compares the spans two
      # real engines produce, the other kills a copy halfway and restarts it.
      - name: Integration tests against ${{ matrix.qdrant }}
        env:
          QDRANT_IMAGE: ${{ matrix.qdrant }}
        run: >
          ./gradlew :kdrant-transport-rest:jvmTest :kdrant-transport-grpc:test
          :kdrant-otel:test :kdrant-migrate:jvmTest
          --tests "*IntegrationTest*" --no-daemon --stacktrace

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
