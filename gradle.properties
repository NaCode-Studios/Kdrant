# Build performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official

# Dokka Gradle Plugin 2.x
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# The Qdrant this client is vendored from and tested against. Every other mention of a Qdrant version
# in this repository is checked against it by `verifyQdrantPin`; see the comment on that task.
qdrantVersion=1.19.1
