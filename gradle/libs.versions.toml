[versions]
kotlin = "2.4.10"
dokka = "2.2.0"
mavenPublish = "0.37.0"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.2"
junit = "6.1.2"
testcontainers = "2.0.5"
ktlint = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
kotest = "6.2.3"
springBoot = "4.1.0"
assertj = "3.27.7"
springAi = "2.0.0"
langchain4j = "1.18.1"
mockk = "1.14.11"
micrometer = "1.17.0"
koog = "1.1.1"
grpc = "1.83.1"
qdrantClient = "1.18.3"
grpcKotlin = "1.5.0"
protobuf = "4.35.1"
opentelemetry = "1.64.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# One engine per target family. Ktor's client API is the same across all four, which is what lets
# RestQdrantTransport live in commonMain and pick an engine per target instead of per code path.
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-curl = { module = "io.ktor:ktor-client-curl", version.ref = "ktor" }
ktor-client-winhttp = { module = "io.ktor:ktor-client-winhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
# Netty rather than CIO for the TLS trust tests: Ktor's CIO server has no HTTPS. Test-only.
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# Generates a self-signed certificate in memory, so the TLS trust tests need no checked-in key and no
# openssl on the runner. Test-only, on purpose: it must never reach a published POM.
ktor-network-tls-certificates = { module = "io.ktor:ktor-network-tls-certificates", version.ref = "ktor" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
# Version comes from the BOM. Declared explicitly so it aligns with junit-platform-engine 6.x —
# older Gradle otherwise injects an unaligned 1.x launcher ("OutputDirectoryCreator not available").
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-qdrant = { module = "org.testcontainers:testcontainers-qdrant", version.ref = "testcontainers" }

kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# Named explicitly on the JVM. `kotlin-test` alone resolves to its JUnit 4 variant in a main source
# set, where there is no test task for Gradle to infer the framework from, and would put JUnit 4 on
# the classpath of a repository that runs JUnit 5 everywhere.
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "springBoot" }
spring-boot-test-autoconfigure = { module = "org.springframework.boot:spring-boot-test-autoconfigure", version.ref = "springBoot" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

spring-ai-vector-store = { module = "org.springframework.ai:spring-ai-vector-store", version.ref = "springAi" }
spring-ai-model = { module = "org.springframework.ai:spring-ai-model", version.ref = "springAi" }
langchain4j-core = { module = "dev.langchain4j:langchain4j-core", version.ref = "langchain4j" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
# rag-base only. The search SPI lives here and is stable; rag-vector is published as a beta and its
# VectorStorageBackend has no search method, so it is the wrong seam as well as the unstable one.
koog-rag-base = { module = "ai.koog:rag-base-jvm", version.ref = "koog" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
# OkHttp rather than netty-shaded: the shaded Netty jar alone is most of the official client's footprint.
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
# The official Java client, as a benchmark dependency and nowhere else. A comparison nobody can run is
# an assertion; this is what makes it a measurement. It must never reach a published POM, which the
# `benchmarks` module's exclusion from publishing already guarantees — that module has no
# mavenPublishing block, so the release workflow's derived artifact list never sees it.
qdrant-client = { module = "io.qdrant:client", version.ref = "qdrantClient" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
guava = { module = "com.google.guava:guava", version = "33.6.0-jre" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
protoc-gen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
protoc-gen-grpc-kotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpcKotlin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# The API artifact only. A library that pulled in the SDK would decide the consumer's exporter,
# sampler and resource for them, which is theirs to configure.
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-extension-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.1" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
protobuf = { id = "com.google.protobuf", version = "0.10.0" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.6" }
